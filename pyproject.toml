[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vybbench"
version = "1.0.0"
description = "VybBench: a design-fidelity benchmark (fonts, colors, edits)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy",
    "pillow",
    "scikit-image",
    "huggingface_hub",
    "google-genai",  # the edit judge
    "openai",        # built-in gpt adapter
    "httpx",         # built-in recraft adapter
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
vybbench = "vybbench.cli:main"

[tool.setuptools]
packages = ["vybbench", "vybbench.models"]
